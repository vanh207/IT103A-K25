<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Bai_5.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Thống Kê Học Tập</title>
    <style></style>
  </head>
  <body>
    <div class="container">
      <div class="stats-section">
        <h2 class="section-title">Thống Kê Học Tập</h2>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="color: #4caf50">
              <i class="fa-solid fa-layer-group"></i>
            </div>
            <span class="stat-number">4</span>
            <span class="stat-label">Tổng khóa học</span>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="color: #e91e63">
              <i class="fa-solid fa-bullseye"></i>
            </div>
            <span class="stat-number">2</span>
            <span class="stat-label">Đang học</span>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="color: #2196f3">
              <i class="fa-solid fa-square-check"></i>
            </div>
            <span class="stat-number">1</span>
            <span class="stat-label">Hoàn thành</span>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="color: #ff9800">
              <i class="fa-solid fa-clock"></i>
            </div>
            <span class="stat-number">43</span>
            <span class="stat-label">Giờ học</span>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="color: #9c27b0">
              <i class="fa-solid fa-certificate"></i>
            </div>
            <span class="stat-number">1</span>
            <span class="stat-label">Chứng chỉ</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
