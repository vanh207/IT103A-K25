<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./Bai3.css">
    <title>Bai3</title>
</head>

<body>
    <header>
    </header>
    <main class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-box">
            <h1 class="text-center">Đăng ký</h1>
            <p class="text-center text-muted">Tạo tài khoản để bắt đầu học tập trên hệ thống E-learning</p>
            <div class="row g-3">
                <div class="col-lg-6 col-sm-12">
                    <label for="name">Họ và tên đệm</label>
                    <input class="form-control" type="text" placeholder="Nguyễn Văn" id ="name">
                </div>
                <div class="col-lg-6 col-sm-12">
                    <label for="fullname">Tên đầy đủ</label>
                    <input class="form-control" type="text" placeholder="An" id = "fullname">
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <label for="Phone">Số điện thoại</label>
                    <input class="form-control"type="tel" id = "Phone" placeholder="0912 345 678">
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <label for="Email">Email</label>
                    <input class="form-control" type="email" id = "Email" placeholder="Nhập địa chỉ email" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <label for="Pass">Mật khẩu</label>
                    <input class="form-control" type="password" id = "Pass" placeholder="Nhập mật khẩu">
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <label for="Pass2">Nhập lại mật khẩu</label>
                    <input class="form-control" type="password" id = "Pass2" placeholder="Nhập lại mật khẩu">
                </div>
            </div>
            <input  class="btn btn-primary form-control" type="submit" value="Submit">
            <div class= "Have--Account">
                <p class="text-center mt-3">Đã có tài khoản ?              <a href="">Đăng nhập</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
